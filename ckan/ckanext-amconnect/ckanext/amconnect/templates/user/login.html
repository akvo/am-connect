{% ckan_extends %}

{% block form %}
  {{ super() }}
  {% if h.amconnect_login_providers %}
    {% for idp, label in h.amconnect_login_providers().items() %}
      <p><a class="btn btn-default" href="{{ h.url_for('amconnect_keycloak.login', idp=idp) }}">{{ _('Continue with %(label)s', label=label) }}</a></p>
    {% endfor %}
  {% endif %}
{% endblock %}

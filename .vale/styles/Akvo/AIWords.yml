# Words and phrases that make text read as machine-written. Seeded from the
# no-ai-slop and humanizer skill lists; add more as reviewers spot them.
extends: existence
message: "'%s' reads as filler; say the plain thing instead."
level: warning
ignorecase: true
tokens:

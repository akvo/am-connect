[project]
name = "amconnect-api"
version = "0.1.0"
description = "AMConnect Platform API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.8",
    "pyjwt[crypto]>=2.15.1",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
